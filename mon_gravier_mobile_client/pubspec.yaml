name: mon_gravier_com
description: Vente de matériaux de construction
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.9 # help us to use SVG in our app
  provider: ^6.1.1 # for State management
  flutter_exit_app: ^1.1.4
  geolocator: ^10.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  money_formatter: ^0.0.3
  get: ^4.6.6
  shared_preferences: ^2.2.3
  # ^8 : la 6.0.0 référence l'embedding Android v1 supprimé de Flutter 3.38
  image_cropper: ^8.0.2
  in_app_review: ^2.0.9
  carousel_slider: ^5.0.0
  flutter_easyloading: ^3.0.5
  item_count_number_button: ^1.9.2
  amazon_like_filter: ^1.0.0
  select_searchable_list: ^0.1.05
  location_picker_flutter_map: ^2.0.0
  buttons_tabbar: ^1.3.10
  searchable_listview: ^2.10.1
  # 0.20.2 imposé par flutter_localizations du SDK Flutter 3.38 (résolution pub sinon impossible)
  intl: ^0.20.2
  # ^8 : la 7.0.2 référence l'embedding Android v1 supprimé de Flutter 3.38
  file_picker: ^8.1.2
  camera_camera: ^3.0.0
  http: ^1.1.0
  liquid_pull_to_refresh: ^3.0.1
  date_field: ^3.0.2
  custom_rating_bar: ^3.0.0
  clipboard: ^0.1.3
  hawk_fab_menu: ^1.2.0
  roundcheckbox: ^2.0.5
  contained_tab_bar_view: ^0.8.0
  printing: ^5.12.0
  pdf: ^3.11.1
  url_launcher: ^6.2.4
  # Remplace uni_links (abandonné, embedding v1) — même usage : flux des deep links.
  app_links: ^6.3.2
  # flutter_osm_plugin retiré : déclaré mais JAMAIS utilisé dans lib/ (et embedding v1).
  # Sa suppression retire aussi permission_handler(_android) transitif fautif.

dependency_overrides:
  geolocator_android: ">=4.4.0 <4.5.0"
  uuid: ^4.1.0
  # Force intl 0.20.2 (pin du SDK Flutter 3.38 via flutter_localizations) malgré
  # location_picker_flutter_map qui exige encore ^0.18.1.
  intl: ^0.20.2
  # Transitifs trop vieux pour Flutter 3.38/Dart 3.9 :
  # - win32 5.1.1 utilise UnmodifiableUint8ListView (supprimé de dart:typed_data)
  # - pdf_widget_wrapper 1.0.1 utilise ViewConfiguration(size:) (API retirée)
  win32: ^5.5.1
  pdf_widget_wrapper: ^1.0.4
  # Versions transitives référençant l'embedding Android v1 supprimé de Flutter 3.38
  # ("error: cannot find symbol ...Registrar") -> forcées vers des versions migrées.
  # ÉPINGLÉES (pas de ^) : les toutes dernières versions utilisent le nouveau DSL
  # Kotlin compilerOptions, incompatible avec notre chaîne Gradle/AGP.
  flutter_plugin_android_lifecycle: 2.0.21
  camera_android: 0.10.10+3
  shared_preferences_android: 2.4.0
  url_launcher_android: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.2
  flutter_launcher_icons: ^0.13.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^3.0.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Muli
      fonts:
        - asset: assets/fonts/muli/Muli.ttf
        - asset: assets/fonts/muli/Muli-Bold.ttf
          weight: 700
        - asset: assets/fonts/muli/Muli-Light.ttf
          weight: 300
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
