// Migration au schéma déclaratif Flutter (l'ancien "apply from: app_plugin_loader.gradle"
// n'est plus supporté par le SDK Flutter actuel). Versions AGP/Kotlin reprises de
// l'ancien buildscript de build.gradle (AGP 8.1.0 / Kotlin 1.9.10).
pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Versions du template officiel Flutter 3.38.4 (Gradle 8.14 dans le wrapper) :
    // l'outillage Gradle de Flutter ne compile plus avec AGP 8.1 / Kotlin 1.9.
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"
