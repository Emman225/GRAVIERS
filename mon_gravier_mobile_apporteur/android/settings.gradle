// Migration au schéma déclaratif Flutter, comme les applications client et
// livreur : l'ancien « apply from: app_plugin_loader.gradle » n'est plus
// supporté par le SDK Flutter actuel, et la compilation s'arrêtait dessus.
pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Versions du template officiel Flutter 3.38.4 : l'outillage Gradle de
    // Flutter ne compile plus avec AGP 7.3 / Kotlin 1.9, qui étaient déclarés
    // dans l'ancien buildscript de build.gradle.
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"
